name: CI (Release)
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '6.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build -c Release --no-restore

    - name: Publish
      run: dotnet publish -p:PublishSingleFile=true -p:CommitHash=${{ github.sha }} -p:CommitRef=${{ github.ref_type }}/${{ github.ref_name }} -r win-x64 -c Release --self-contained false .\PlasmicTrap\PlasmicTrap.csproj

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: PlasmicTrap (Release) (${{ github.sha }})
        path: .\PlasmicTrap\bin\Release\net6.0-windows\win-x64\publish\*

    - name: Name release binary
      if: startsWith(github.ref, 'refs/tags/v')
      run: Copy-Item .\PlasmicTrap\bin\Release\net6.0-windows\win-x64\publish\PlasmicTrap.exe PlasmicTrap-${{ github.ref_name }}.exe

    - name: Create release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        draft: true
        files: PlasmicTrap-${{ github.ref_name }}.exe
        name: PlasmicTrap ${{ github.ref_name }}
